<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verificación de certificado — CBVI</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b20" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="description" content="Verificación pública de conceptos técnicos de seguridad humana y protección contra incendios del Cuerpo de Bomberos Voluntarios de Inírida.">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ink:#14181d; --paper:#eceef1; --surface:#fff; --surface-2:#f6f7f9;
    --muted:#626b76; --faint:#6f7883; --line:#d9dde3; --line-2:#e8ebef;
    --ember:#c0271f; --azul:#2563a8; --line-strong:#9aa3ae;
    --verde:#17864b; --ambar:#a8650a; --rojo:#c0271f; --gris:#626b76;
    --r-sm:4px;
    --ff-h:"Saira",sans-serif; --ff:"Public Sans",sans-serif;
    --ff-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#eef1f4; --paper:#0f1216; --surface:#171b20; --surface-2:#1d2229;
    --muted:#9aa3ae; --faint:#8a93a0; --line:#2b313a; --line-2:#232931;
    --verde:#49b97d; --ambar:#e0a23f; --rojo:#ef5a50; --gris:#9aa3ae;
    --ember:#ef5a50; --azul:#5a9be0; --line-strong:#4a525d;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --ink:#eef1f4; --paper:#0f1216; --surface:#171b20; --surface-2:#1d2229;
    --muted:#9aa3ae; --faint:#8a93a0; --line:#2b313a; --line-2:#232931;
    --verde:#49b97d; --ambar:#e0a23f; --rojo:#ef5a50; --gris:#9aa3ae;
    --ember:#ef5a50; --azul:#5a9be0; --line-strong:#4a525d; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ff);line-height:1.5;min-height:100vh;overflow-x:clip}
  h1,h2,h3{font-family:var(--ff-h);margin:0}
  .mono{font-family:var(--ff-m);font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* Membrete: el mismo del certificado impreso */
  .membrete{background:var(--surface);padding:14px max(16px,env(safe-area-inset-right)) 13px max(16px,env(safe-area-inset-left));position:relative;border-bottom:1px solid var(--ink)}
  .membrete:after{content:"";position:absolute;left:0;right:0;bottom:-5px;border-top:3px solid var(--ember)}
  .mem{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .mem img{width:54px;height:54px;flex:0 0 auto;object-fit:contain}
  .mem h1{font-size:1rem;font-weight:700;line-height:1.2}
  .mem p{margin:2px 0 0;font-size:.8125rem;color:var(--muted)}

  .wrap{max-width:640px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 36px max(16px,env(safe-area-inset-left))}

  /* La hoja: marco doble, microtexto y escudo de fondo */
  .hoja{position:relative;background:var(--surface);border:1.2px solid var(--ink);padding:0;overflow:hidden}
  .hoja:after{content:"";position:absolute;inset:9px;border:.5px solid var(--ink);pointer-events:none}
  .micro{position:absolute;left:3px;right:3px;font:500 3.6px/5px var(--ff);color:var(--muted);white-space:nowrap;overflow:hidden;letter-spacing:.2px;user-select:none}
  .micro.ar{top:2px}.micro.ab{bottom:2px}
  .agua{position:absolute;right:-70px;bottom:-40px;width:320px;opacity:.06;pointer-events:none}
  .cuerpo{position:relative;padding:18px}

  /* Veredicto sobre la roseta de línea fina */
  .ve{--c:var(--gris);position:relative;min-height:158px;display:grid;place-items:center;text-align:center;border:1.3px solid var(--c);overflow:hidden;margin-bottom:14px;padding:18px 10px}
  .ve svg{position:absolute;inset:0;width:100%;height:100%;color:var(--c)}
  .ve .sv{position:relative;background:var(--surface);padding:7px 12px;max-width:100%}
  .ve h2{font-size:1.34rem;font-weight:800;line-height:1.12;color:var(--c);letter-spacing:.2px}
  .ve p{margin:4px 0 0;font-size:.875rem;font-weight:500;color:var(--ink);max-width:44ch}
  .s-vigente{--c:var(--verde)} .s-porvencer{--c:var(--ambar)}
  .s-vencido,.s-nofav,.s-invalido{--c:var(--rojo)} .s-cargando,.s-aviso{--c:var(--gris)}
  .spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  .grupo{font-family:var(--ff-h);font-weight:700;font-size:.875rem;display:flex;align-items:center;gap:8px;margin:16px 0 2px}
  .grupo:after{content:"";flex:1;border-top:1px solid var(--line-strong)}
  .fila{padding:8px 0;border-bottom:1px solid var(--line-2);overflow-wrap:anywhere;font-size:.9375rem;font-weight:500}
  .fila:last-child{border-bottom:0}
  .fila span{display:block;font-size:.75rem;font-weight:600;color:var(--muted)}
  .fila .mono{display:inline;font-size:.9375rem;font-weight:500;color:inherit}
  .puntaje{display:flex;align-items:center;gap:14px;padding:6px 0 10px;border-bottom:1px solid var(--line-2)}
  .puntaje b{font-family:var(--ff-h);font-weight:800;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums}
  .puntaje b small{font:600 .8125rem var(--ff);display:block;text-align:center;margin-top:2px;color:var(--muted)}
  .puntaje div{font-size:.875rem;color:var(--ink)}
  .puntaje div strong{display:block;font-family:var(--ff-h);font-size:1rem}

  .vivo{display:flex;gap:8px;align-items:center;margin-top:12px;font:500 .8125rem var(--ff-m);font-variant-numeric:tabular-nums}
  .vivo:before{content:"";width:8px;height:8px;background:var(--verde);border-radius:50%;flex:none;animation:lt 2s ease-in-out infinite}
  @keyframes lt{50%{opacity:.35}}
  .vivonota{margin:2px 0 0;font-size:.75rem;color:var(--muted)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;margin-top:14px;
    border-radius:var(--r-sm);border:1px solid var(--ink);background:var(--ink);color:var(--surface);
    font-size:.9375rem;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;width:100%;
    transition:transform .1s ease-out;touch-action:manipulation}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible,.manual input:focus-visible,.foot a:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

  .manual label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
  .manual input{width:100%;min-height:50px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-family:var(--ff-m);font-size:1rem;margin-bottom:12px;text-transform:uppercase}
  .ff2{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px}
  @media (max-width:430px){.ff2{grid-template-columns:minmax(0,1fr);gap:0}}

  .foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:20px;line-height:1.6}
  .foot b{font-weight:600;color:var(--ink)}

  @media (prefers-reduced-motion:reduce){.spin,.vivo:before{animation:none}.btn{transition:none}}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mem img{background:#fff;padding:3px;border-radius:var(--r-sm)}}
  :root[data-theme="dark"] .mem img{background:#fff;padding:3px;border-radius:var(--r-sm)}
  @media print{
    :root{--ink:#14181d!important;--paper:#fff!important;--surface:#fff!important;--surface-2:#fff!important;--muted:#626b76!important;--line:#d9dde3!important;--line-2:#e8ebef!important;--line-strong:#9aa3ae!important;--verde:#17864b!important;--ambar:#a8650a!important;--rojo:#c0271f!important;--ember:#c0271f!important;--gris:#626b76!important}
    body{background:#fff}.manual,.btn{display:none!important}
    .membrete:after{border-top-color:#c0271f}
  }
</style>
</head>
<body>

<header class="membrete">
  <div class="mem">
    <img data-logo alt="Escudo del Cuerpo de Bomberos Voluntarios de Inírida">
    <div>
      <h1>Cuerpo de Bomberos Voluntarios de Inírida</h1>
      <p>Verificación de certificado</p>
    </div>
  </div>
</header>

<main class="wrap">
  <article class="hoja">
    <div class="micro ar" aria-hidden="true" data-micro></div>
    <img class="agua" data-logo alt="">
    <div class="cuerpo">
      <section id="estado" class="ve s-cargando" role="status" aria-live="polite">
        <svg id="trama" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 320 160"></svg>
        <div class="sv" id="estadoTxt"><h2><span class="spin"></span>Consultando</h2><p>Validando el certificado con el servidor del CBVI.</p></div>
      </section>

      <div id="contenido"></div>

      <form id="manual" class="manual" hidden>
        <div class="ff2">
          <div><label for="mc">Número del certificado</label>
            <input id="mc" type="text" placeholder="RT-2026-0000" autocomplete="off" spellcheck="false" autocapitalize="characters" required></div>
          <div><label for="md">Distintivo</label>
            <input id="md" type="text" placeholder="A1B2C3" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="8" required></div>
        </div>
        <button class="btn" type="submit" style="margin-top:0">Verificar</button>
      </form>
    </div>
    <div class="micro ab" aria-hidden="true" data-micro></div>
  </article>

  <p class="foot">
    Verificación en línea del <b>Cuerpo de Bomberos Voluntarios de Inírida</b>, Guainía, Colombia.<br>
    Abnegación y Disciplina.
  </p>
</main>

<script src="logos.js?v=1.21"></script>
<script>
(function(){
"use strict";

/* ====== Backend (I1: esta URL NO cambia) ====== */
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbzXkG5Kw1kapPK1dwL55PdhUwCrkZP0Qmdok84rE7PpO-iWl4pIR8-u-yuZrS73T3Kp/exec";

var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

function fecha(v){
  if(!v) return "—";
  var d = new Date(v);
  if(isNaN(d)){ return String(v); }
  return d.toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
}
/* El backend guarda la clave interna ("primera"); aqui se muestra en palabras. */
var TRAMITES={primera:"Primera vez",renovacion:"Renovación",cambio:"Cambio de razón social o propietario"};
function tramiteLegible(t){ return TRAMITES[t]||t||"—"; }

/* ====== Elementos de seguridad: microtexto y roseta de línea fina ====== */
var MT = "CUERPO DE BOMBEROS VOLUNTARIOS DE INÍRIDA ABNEGACIÓN Y DISCIPLINA ";
Array.prototype.forEach.call(document.querySelectorAll("[data-micro]"),function(m){
  m.textContent = new Array(10).join(MT);
});
(function roseta(){
  var d="", W=320, H=160;
  for(var k=0;k<30;k++){
    var ph=k*Math.PI/15; d+="M";
    for(var a=0;a<=360;a+=4){
      var t=a*Math.PI/180, R=118*(1+.42*Math.cos(9*t+ph));
      d+=(a?" ":"")+(W/2+R*Math.cos(t)*1.05).toFixed(1)+" "+(H/2+R*Math.sin(t)*.56).toFixed(1);
    }
    d+="Z";
  }
  $("#trama").innerHTML='<path d="'+d+'" fill="none" stroke="currentColor" stroke-width=".3" opacity=".55" vector-effect="non-scaling-stroke"/>';
})();

var EST = {
  vigente:  {cls:"s-vigente",  ic:"✔", t:"CERTIFICADO VIGENTE",  p:"Auténtico. Registrado en el CBVI."},
  porvencer:{cls:"s-porvencer",ic:"⏳", t:"POR VENCER",           p:"Auténtico y aún válido, pero vence pronto. Debe renovarse."},
  vencido:  {cls:"s-vencido",  ic:"✖", t:"CERTIFICADO VENCIDO",  p:"La vigencia de este concepto ya terminó. Debe solicitarse una nueva revisión."},
  nofav:    {cls:"s-nofav",    ic:"✖", t:"CONCEPTO NO FAVORABLE",p:"La revisión no resultó favorable. El establecimiento debe subsanar los hallazgos."},
  invalido: {cls:"s-invalido", ic:"✖", t:"NO VERIFICADO",        p:"El número o el distintivo no coinciden con los registros del CBVI. No lo aceptes como auténtico sin confirmarlo con la estación."}
};

/* html lleva solo texto fijo o ya escapado; txt pasa por esc() aquí. */
function estado(cls, html, txt){
  $("#estado").className = "ve " + cls;
  $("#estadoTxt").innerHTML = '<h2>'+html+'</h2>'+(txt?'<p>'+esc(txt)+'</p>':'');
}
function pintarEstado(k){
  var e = Object.prototype.hasOwnProperty.call(EST,k) ? EST[k] : EST.invalido;
  estado(e.cls, e.ic+" "+esc(e.t), e.p);
}
function cargando(txt){ estado("s-cargando",'<span class="spin"></span>Consultando',txt); }

function fila(k, v, mono){
  if(v==null || v==="" ) return "";
  return '<div class="fila"><span>'+esc(k)+'</span>'+(mono?'<span class="mono">'+esc(v)+'</span>':esc(v))+'</div>';
}

var _reloj=null;
function pintarCert(d, distintivo){
  var col = d.favorable ? "var(--verde)" : "var(--rojo)";
  var html =
    '<div class="puntaje"><b style="color:'+col+'">'+esc(d.score100)+'<small>de 100</small></b>'+
    '<div><strong style="color:'+col+'">'+(d.favorable?"Concepto favorable":"Concepto no favorable")+'</strong>'+
      'Nivel de riesgo: '+esc(d.riesgo||"—")+'</div></div>'+
    (d.favorable?fila("Vigente hasta", fecha(d.vigenciaHasta)):"")+
    '<div class="grupo">Establecimiento</div>'+
    fila("Nombre", d.establecimiento)+
    fila("Razón social", d.razonSocial)+
    fila("Propietario o encargado", d.propietario)+
    fila("NIT", d.nit, true)+
    fila("Dirección", [d.direccion,d.barrio].filter(Boolean).join(", "))+
    fila("Actividad", d.actividad)+
    '<div class="grupo">Revisión</div>'+
    fila("Número y distintivo", d.codigo+(distintivo?" · "+distintivo:""), true)+
    fila("Tipo de trámite", tramiteLegible(d.tramite))+
    fila("Fecha de revisión", fecha(d.fecha))+
    fila("Inspector", d.inspector)+
    fila("Expedido por", "Cuerpo de Bomberos Voluntarios de Inírida")+
    '<div class="vivo" id="vivo"></div>'+
    '<p class="vivonota">La hora avanza en vivo: una captura de pantalla no lo haría.</p>';
  /* Solo enlaces web reales: nada de javascript: ni rutas raras. */
  if(d.pdfUrl && /^https:\/\//i.test(String(d.pdfUrl))){
    html += '<a class="btn" href="'+esc(d.pdfUrl)+'" target="_blank" rel="noopener">Ver o descargar el certificado (PDF)</a>';
  }
  $("#contenido").innerHTML = html;
  var pintaHora=function(){
    var v=$("#vivo"); if(!v) return;
    v.textContent="Consultado ahora, "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  };
  if(_reloj) clearInterval(_reloj);
  pintaHora(); _reloj=setInterval(pintaHora,1000);
}

function pedirDatos(c,d){
  if(c) $("#mc").value=c; if(d) $("#md").value=d;
  $("#manual").hidden = false;
}

/* Solo se acusa cuando el servidor dice que el código y el distintivo no coinciden.
   Un error interno del servidor no dice nada sobre el documento. */
function esNoCoincide(msg){ return /^(No existe|El distintivo|El código o el distintivo)/.test(String(msg||"")); }

var _turno=0;
function consultar(c, d){
  var turno=++_turno, vivo=function(){return turno===_turno};
  /* Tope de 20 s: en Inírida la señal débil deja la petición colgada. */
  var tope=setTimeout(function(){if(vivo()){_turno++;servidorNoResponde(c,d)}},20000);
  cargando("Validando el certificado con el servidor del CBVI.");
  $("#contenido").innerHTML = "";
  if(_reloj){ clearInterval(_reloj); _reloj=null; }

  /* Al servidor el código va como "cod", NUNCA "c": Google reserva ese
     parámetro y responde su página de error sin ejecutar el script. */
  var url = BACKEND_URL + "?api=1&cod=" + encodeURIComponent(c) + "&d=" + encodeURIComponent(d||"");
  fetch(url, { method:"GET" })
    .then(function(r){ return r.text().then(function(t){ try{ return JSON.parse(t); }catch(e){ return { _noJson:true }; } }); })
    .then(function(res){
      if(!vivo()) return;
      clearTimeout(tope);
      if(res && res._noJson){ reintentarEnElServidor(c,d); return; }
      if(!res || !res.ok || !res.cert){
        if(res && esNoCoincide(res.error)){ pintarEstado("invalido"); pedirDatos(c,d); }
        else servidorNoResponde(c,d);
        return;
      }
      pintarEstado(res.cert.estado);
      pintarCert(res.cert, d);
      $("#manual").hidden = true;
    })
    .catch(function(){
      if(!vivo()) return;
      clearTimeout(tope);
      if(navigator.onLine === false){
        estado("s-aviso","Sin conexión","Tu teléfono no tiene internet. Eso no dice nada del certificado: conéctate e inténtalo de nuevo.");
        pedirDatos(c,d);
      } else servidorNoResponde(c,d);   /* puede ser señal débil: no se abandona esta página */
    });
}
/* Plan B del QR.
   Si el fetch no devuelve JSON (el navegador bloqueó la consulta entre
   dominios, o Google respondió su página de permisos porque la implementación
   no está publicada para "cualquier persona"), NO dejamos al cliente con un
   aviso de mantenimiento: lo llevamos a la página de verificación del propio
   servidor. Eso es una navegación normal, no una consulta entre dominios.
   Salto automático solo si el servidor SÍ respondió (algo que no es JSON): ahí hay
   red. Si no hubo respuesta queda un botón, para que la señal débil no termine en la
   página de error del navegador. */
var _planB = false;
function urlPlanB(c,d){ return BACKEND_URL + "?basico=1&cod=" + encodeURIComponent(c) + "&d=" + encodeURIComponent(d||""); }
function reintentarEnElServidor(c,d){
  if(_planB || !c){ servidorNoResponde(c,d); return; }
  _planB = true;
  cargando("Abriendo la verificación oficial del CBVI.");
  /* basico=1: que el servidor responda él mismo. Sin esto, el servidor nos
     devolvería a esta misma página y quedaríamos rebotando sin fin. */
  setTimeout(function(){ location.replace(urlPlanB(c,d)); }, 350);
}
function servidorNoResponde(c,d){
  estado("s-aviso","Servicio no disponible","El servidor del CBVI no respondió. Eso no dice nada del certificado: inténtalo en unos minutos o comunícate con la estación.");
  pedirDatos(c,d);
  $("#contenido").innerHTML = (c&&d) ? '<a class="btn" style="background:transparent;color:var(--ink);margin:0 0 14px" href="'+esc(urlPlanB(c,d))+'">Abrir la verificación del servidor</a>' : "";
}

/* ====== Arranque ====== */
var p = new URLSearchParams(location.search);
var c = (p.get("c")||"").trim().toUpperCase(), d = (p.get("d")||"").trim().toUpperCase();

if(c && d){
  consultar(c, d);
} else {
  /* Sin distintivo el servidor no entrega datos: así nadie puede recorrer los
     números consecutivos para sacar NIT, propietario y dirección de los comercios. */
  $("#mc").value = c;
  estado("s-cargando", c?"Falta el distintivo":"Verificar un certificado",
    "Escribe el número y el distintivo que aparecen en el documento, junto al código QR.");
  pedirDatos();
}

$("#manual").addEventListener("submit", function(ev){
  ev.preventDefault();
  var mc = ($("#mc").value||"").trim().toUpperCase(), md = ($("#md").value||"").trim().toUpperCase();
  if(!mc || !md) return;
  _planB = false;
  consultar(mc, md);
});
})();
</script>
</body>
</html>
