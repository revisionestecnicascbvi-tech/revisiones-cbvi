<title>CBVI Revisiones Técnicas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* ===== Sistema de diseño — "Consola de campo" bomberil =====
     Riel de mando carboncillo + lienzo claro de alto contraste; acento rojo brasa;
     semáforo de vigencia (verde/ámbar/rojo/gris) como lenguaje visual transversal.
     Saira (titulares/números) · Public Sans (texto) · IBM Plex Mono (códigos). */
  :root{
    --ink:#14181d; --ink-2:#2a3139; --paper:#eceef1; --paper-2:#e3e6ea;
    --surface:#ffffff; --surface-2:#f6f7f9; --muted:#626b76; --faint:#8b94a0;
    --line:#d9dde3; --line-2:#e8ebef;
    --rail:#191d23; --rail-2:#22272f; --rail-ink:#cdd3db; --rail-faint:#79818c;
    --ember:#dc3b2c; --ember-2:#b32a1e; --ember-ink:#ffffff;
    --verde:#17864b; --verde-bg:#e4f1e8; --ambar:#c9790c; --ambar-bg:#f8eed8;
    --rojo:#c0271f; --rojo-bg:#f7e4e2; --gris:#737c87; --gris-bg:#e9ecef;
    --azul:#2563a8;
    --radius:16px; --radius-sm:10px; --tap:52px;
    --shadow:0 1px 2px rgba(16,20,26,.05),0 10px 26px -12px rgba(16,20,26,.18);
    --shadow-rail:0 0 0 1px rgba(255,255,255,.04);
    --ff-h:"Saira",system-ui,sans-serif; --ff:"Public Sans",system-ui,-apple-system,sans-serif;
    --ff-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#eef1f4; --ink-2:#c5ccd4; --paper:#0f1216; --paper-2:#0b0e11;
    --surface:#171b20; --surface-2:#1d2229; --muted:#9aa3ae; --faint:#6b747f;
    --line:#2b313a; --line-2:#232931;
    --rail:#0c0f12; --rail-2:#161a1f; --rail-ink:#cdd3db; --rail-faint:#79818c;
    --ember:#f05545; --ember-2:#c63426; --ember-ink:#14181d;
    --verde:#49b97d; --verde-bg:#15271d; --ambar:#e0a23f; --ambar-bg:#2a2214; --rojo:#ef5a50; --rojo-bg:#2b1715;
    --gris:#8a93a0; --gris-bg:#20262e; --azul:#5a9be0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --ink:#eef1f4; --ink-2:#c5ccd4; --paper:#0f1216; --paper-2:#0b0e11;
    --surface:#171b20; --surface-2:#1d2229; --muted:#9aa3ae; --faint:#6b747f;
    --line:#2b313a; --line-2:#232931;
    --rail:#0c0f12; --rail-2:#161a1f; --rail-ink:#cdd3db; --rail-faint:#79818c;
    --ember:#f05545; --ember-2:#c63426; --ember-ink:#14181d;
    --verde:#49b97d; --verde-bg:#15271d; --ambar:#e0a23f; --ambar-bg:#2a2214; --rojo:#ef5a50; --rojo-bg:#2b1715;
    --gris:#8a93a0; --gris-bg:#20262e; --azul:#5a9be0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ff);line-height:1.45;-webkit-text-size-adjust:100%}
  h1,h2,h3,h4{font-family:var(--ff-h);margin:0;letter-spacing:.2px;text-wrap:balance}
  .num{font-family:var(--ff-h);font-variant-numeric:tabular-nums}
  .mono{font-family:var(--ff-m);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  [hidden]{display:none!important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  /* ===== Login ===== */
  #login{min-height:100%;display:grid;place-items:center;
    padding:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));
    background:radial-gradient(130% 90% at 50% -10%, rgba(220,59,44,.14), transparent 60%), var(--paper)}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
  .login-top{background:var(--rail);color:#fff;padding:26px 24px;display:flex;align-items:center;gap:14px}
  .emblem{width:46px;height:46px;border-radius:12px;background:var(--ember);color:#fff;display:grid;place-items:center;font-family:var(--ff-h);font-weight:700;font-size:16px;flex:0 0 auto}
  .logo-chip{background:#fff;border-radius:12px;padding:5px;display:grid;place-items:center;flex:0 0 auto;width:46px;height:46px}
  .logo-chip img{width:100%;height:100%;object-fit:contain;display:block}
  .logo-chip.sm{width:40px;height:40px;border-radius:10px;padding:4px}
  .login-top h1{font-size:19px;line-height:1.05}
  .login-top p{margin:3px 0 0;font-size:11px;letter-spacing:2.5px;color:var(--rail-faint)}
  .login-body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:16px}
  .login-body h2{font-size:15px;font-weight:600;color:var(--muted);font-family:var(--ff)}
  .userpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .userpick button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
  .userpick button .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--paper-2);font-size:18px}
  .userpick button b{font-size:13.5px;font-family:var(--ff-h)}
  .userpick button small{font-size:11px;color:var(--muted)}
  .userpick button.sel{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 8%,var(--surface))}
  .pin{display:flex;gap:10px;justify-content:center}
  .pin input{width:52px;height:60px;text-align:center;font-size:24px;font-family:var(--ff-m);border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink)}
  .pin input:focus{outline:2px solid var(--ember);border-color:var(--ember)}
  .login-hint{font-size:12px;color:var(--faint);text-align:center}

  /* ===== App shell ===== */
  #app{min-height:100%;display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
  .rail{grid-row:1 / span 2;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;
    padding:16px 12px calc(16px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));position:sticky;top:0;height:100vh}
  .rail .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
  .rail .brand b{font-family:var(--ff-h);font-weight:700;font-size:16px;color:#fff;line-height:1}
  .rail .brand span{font-size:9.5px;letter-spacing:2px;color:var(--rail-faint);display:block;margin-top:3px}
  .rail nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .rail nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--rail-ink);
    padding:11px 12px;border-radius:11px;font-size:14px;font-weight:500;text-align:left;width:100%}
  .rail nav button .ic{width:20px;text-align:center;font-size:16px;opacity:.85}
  .rail nav button:hover{background:var(--rail-2)}
  .rail nav button.on{background:var(--ember);color:#fff}
  .rail nav button.on .ic{opacity:1}
  .rail nav button .badge{margin-left:auto;background:var(--ember);color:#fff;border-radius:999px;font-size:11px;font-family:var(--ff-m);padding:1px 7px;min-width:20px;text-align:center}
  .rail nav button.on .badge{background:rgba(0,0,0,.25)}
  .rail .who{border-top:1px solid var(--rail-2);padding-top:12px;display:flex;align-items:center;gap:10px;font-size:13px}
  .rail .who .av{width:32px;height:32px;border-radius:50%;background:var(--rail-2);display:grid;place-items:center;font-family:var(--ff-h);font-weight:600;color:#fff;font-size:13px}
  .rail .who .nm{flex:1;min-width:0}
  .rail .who .nm b{color:#fff;font-size:13px;display:block;font-family:var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail .who .nm small{color:var(--rail-faint);font-size:11px}
  .rail .who button{background:none;border:0;color:var(--rail-faint);font-size:17px;padding:4px}

  .topbar{grid-column:2;background:var(--surface);border-bottom:1px solid var(--line);
    padding:0 clamp(16px,3vw,28px);height:62px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .topbar h2{font-size:19px;font-family:var(--ff-h);font-weight:600}
  .topbar .sub{color:var(--muted);font-size:13px;margin-left:2px;align-self:center}
  .topbar .sp{flex:1}
  .icbtn{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:16px;display:grid;place-items:center}
  .icbtn:hover{border-color:var(--ember)}
  .syncbadge{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .syncbadge.ok{color:var(--verde);background:var(--verde-bg);border-color:var(--verde)}
  .syncbadge.pend{color:var(--ambar);background:var(--ambar-bg);border-color:var(--ambar)}
  .syncbadge.off{color:var(--muted);background:var(--surface-2)}
  main{grid-column:2;padding:clamp(16px,3vw,28px);padding-bottom:96px}
  .maxw{max-width:1080px;margin:0 auto}

  /* ===== Bottom tabs (móvil) ===== */
  .tabs{display:none}
  @media (max-width:860px){
    #app{grid-template-columns:1fr}
    .rail{display:none}
    .topbar{grid-column:1}
    main{grid-column:1;padding-bottom:84px}
    .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--rail);
      padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));justify-content:space-around}
    .tabs button{background:none;border:0;color:var(--rail-faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:4px 8px;border-radius:10px;flex:1}
    .tabs button .ic{font-size:19px}
    .tabs button.on{color:#fff}
    .tabs button.on .ic{color:var(--ember)}
  }

  /* ===== Componentes ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .grid{display:grid;gap:16px}
  .btn{appearance:none;border:1px solid transparent;border-radius:12px;min-height:var(--tap);padding:0 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:9px}
  .btn-p{background:var(--ember);color:var(--ember-ink);box-shadow:0 2px 0 var(--ember-2)}
  .btn-p:active{transform:translateY(1px);box-shadow:none}
  .btn-g{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn-g:hover{background:var(--surface-2)}
  .btn-sm{min-height:42px;font-size:13.5px;padding:0 14px;border-radius:10px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;line-height:1.3}
  .chip .dotc{width:8px;height:8px;border-radius:50%}
  .st-vigente{color:var(--verde);background:var(--verde-bg)} .st-vigente .dotc{background:var(--verde)}
  .st-porvencer{color:var(--ambar);background:var(--ambar-bg)} .st-porvencer .dotc{background:var(--ambar)}
  .st-vencido{color:var(--rojo);background:var(--rojo-bg)} .st-vencido .dotc{background:var(--rojo)}
  .st-sinrev{color:var(--gris);background:var(--gris-bg)} .st-sinrev .dotc{background:var(--gris)}
  .st-nofav{color:#fff;background:var(--rojo)} .st-nofav .dotc{background:#fff}

  .sech{display:flex;align-items:center;gap:10px;margin:26px 2px 12px}
  .sech h3{font-size:14px;font-weight:700;letter-spacing:.4px;color:var(--ink)}
  .sech .ln{flex:1;height:1px;background:var(--line)}
  .sech .act{font-size:13px;color:var(--ember);font-weight:600;background:none;border:0}

  /* Dashboard tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:3px}
  .tile .v{font-family:var(--ff-h);font-size:32px;font-weight:700;line-height:1}
  .tile .k{font-size:13px;color:var(--muted)}
  .tile .bar{height:5px;border-radius:3px;background:var(--paper-2);margin-top:8px;overflow:hidden}
  .tile .bar i{display:block;height:100%}
  .tile.accent{background:linear-gradient(140% 160% at 100% 0,color-mix(in srgb,var(--ember) 14%,var(--surface)),var(--surface))}

  /* Meta gauge */
  .metacard{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .ring{--p:0;width:122px;height:122px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--ember) calc(var(--p)*1%), var(--paper-2) 0);display:grid;place-items:center;position:relative}
  .ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
  .ring .in{position:relative;text-align:center;z-index:1}
  .ring .in b{font-family:var(--ff-h);font-size:28px;display:block;line-height:1}
  .ring .in small{font-size:11px;color:var(--muted)}
  .metalist{flex:1;min-width:220px;display:grid;gap:10px}
  .metarow{display:grid;gap:5px}
  .metarow .t{display:flex;justify-content:space-between;font-size:13px}
  .metarow .t b{font-family:var(--ff-h)}
  .metarow .bar{height:7px;border-radius:4px;background:var(--paper-2);overflow:hidden}
  .metarow .bar i{display:block;height:100%;background:var(--ember)}

  /* Listas / filas */
  .row-item{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left;color:inherit}
  .row-item:hover{border-color:var(--ember)}
  .row-item .ava{width:44px;height:44px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;background:var(--surface-2);border:1px solid var(--line)}
  .row-item .meta{flex:1;min-width:0}
  .row-item .meta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--ff-h);font-weight:600}
  .row-item .meta small{color:var(--muted);font-size:12.5px}
  .listgrid{display:grid;gap:10px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%}
  .filterpills{display:flex;gap:7px;flex-wrap:wrap}
  .filterpills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .filterpills button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* Inputs */
  label.lbl{font-size:11.5px;letter-spacing:.3px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px}
  input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{
    font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-height:46px;width:100%}
  textarea{min-height:60px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ember);outline-offset:1px;border-color:var(--ember)}
  .ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
  .ff .wide{grid-column:1/-1}

  /* Mapa de barrido (dibujado) */
  .mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:
    linear-gradient(0deg,rgba(0,0,0,.02),rgba(0,0,0,.02)),var(--surface-2);box-shadow:var(--shadow)}
  .mapwrap svg{display:block;width:100%;height:auto}
  .mk{cursor:pointer}
  .mk circle{stroke:var(--surface);stroke-width:2.5}
  .maplegend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .maplegend span{display:inline-flex;align-items:center;gap:6px}
  .maplegend i{width:10px;height:10px;border-radius:50%}

  /* Inspección */
  .modeseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .modeseg button{border:0;background:none;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .modeseg button.on{background:var(--ember);color:#fff}
  .modhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);background:var(--surface-2);border-radius:16px 16px 0 0}
  .modhead .n{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--ff-h);font-weight:700}
  .modhead h4{font-size:15.5px;font-family:var(--ff-h)}
  .modhead .mx{margin-left:auto;font-family:var(--ff-m);font-size:12px;color:var(--muted);background:var(--paper-2);border-radius:7px;padding:3px 8px}
  .item{padding:14px 16px;border-bottom:1px solid var(--line-2)}
  .item:last-child{border-bottom:0}
  .item .q{font-size:14.5px;margin-bottom:9px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;min-height:44px;padding:0 15px;font-size:14px;font-weight:600}
  .opt.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .opt.sel.good{background:var(--verde);border-color:var(--verde);color:#fff}
  .opt.sel.bad{background:var(--rojo);border-color:var(--rojo);color:#fff}
  .itools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mini{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:9px;min-height:38px;padding:0 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .mini:hover{border-color:var(--ember);color:var(--ink)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs figure{position:relative;margin:0;width:62px;height:62px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .thumbs img{width:100%;height:100%;object-fit:cover}
  .thumbs button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
  .fuentes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
  .fchk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface-2);font-size:13px;min-height:42px}
  .fchk.on{background:var(--rojo-bg);border-color:var(--rojo);color:var(--rojo);font-weight:600}

  .scorebar{position:fixed;bottom:0;left:232px;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -6px 20px -8px rgba(16,20,26,.25);
    padding:10px clamp(16px,3vw,28px) calc(10px + env(safe-area-inset-bottom))}
  @media (max-width:860px){.scorebar{left:0;bottom:64px}}
  .scorebar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px}
  .minigauge{width:54px;height:54px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;--p:0;--c:var(--gris);
    background:conic-gradient(var(--c) calc(var(--p)*1%),var(--paper-2) 0)}
  .minigauge::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
  .minigauge b{position:relative;font-family:var(--ff-h);font-size:17px}
  .scorebar .vd{flex:1;min-width:0}
  .scorebar .vd .r{font-family:var(--ff-h);font-size:16px}
  .scorebar .vd .d{font-size:12px;color:var(--muted)}

  /* Certificado */
  .cert{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .cert .top{background:var(--rail);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:14px}
  .cert .top h3{font-size:18px}
  .cert .top small{font-size:10px;letter-spacing:2px;color:var(--rail-faint);display:block}
  .cert .bd{padding:20px}

/* ---------- scoring ---------- */
function itemMax(it){if(it.score===false||it.tipo==="texto")return 0;if(it.tipo==="fuentes")return it.maxPuntos||(it.fuentes?it.fuentes.length:0);return Math.max.apply(null,(it.opts||[{p:0}]).map(function(o){return o.p}))}
function inInter(it){return INTER.has(it.id)}
function scoreVal(f,it){ if(it.tipo==="fuentes"){var pr=(f.fuentes[it.id]||[]).length;return Math.max(0,(it.maxPuntos||it.fuentes.length)-pr*(it.puntosPorAusencia||1))}
  var v=f.ans[it.id];if(v==null)return null;var o=(it.opts||[]).find(function(o){return o.v===v});return o?o.p:null}
function depOk(f,it){ if(!it.dependsOn)return true; return f.ans[it.dependsOn.item]===it.dependsOn.value }
function compute(f){
  var intermedia=f.modo==="intermedia";
  var X=0,Y=0,got=0,tot=0,recs=[],sumMax=0,sumVal=0;
  MOD.forEach(function(m){
    var toggleNo=false, modVal=0, modMax=0;
    if(m.toggle){ var tv=f.ans[m.toggle.id];
      var tInc=!intermedia||INTERT.has(m.toggle.id);
      if(tInc){tot++; if(tv)got++;}
      if(tv==="NO"){toggleNo=true; modVal+=m.toggle.noScore; modMax+=m.toggle.noScore;}
    }
    if(!toggleNo){ m.items.forEach(function(it){
      if(it.score===false||it.tipo==="texto")return;
      if(intermedia&&!inInter(it))return;
      if(!depOk(f,it))return;                 // no aplica (dependencia) -> no se cuenta
      var mx=itemMax(it); modMax+=mx; tot++;
      var p=scoreVal(f,it);
      var ans=(it.tipo==="fuentes")?(f.fuentes[it.id]!==undefined):(f.ans[it.id]!=null);
      if(ans){got++; modVal+=(p||0);
        if(it.tipo!=="fuentes"&&p!=null&&p<mx)recs.push({q:it.label,r:f.ans[it.id]});
        if(it.tipo==="fuentes"){var pr=f.fuentes[it.id]||[];if(pr.length)recs.push({q:"Fuentes de ignición observadas",r:pr.join(", ")})}
      }
    });}
    if(m.clase==="agravante")X+=modVal; else if(m.clase==="reductor")Y+=modVal;
    sumMax+=modMax; sumVal+=modVal;
  });
  var raw=sumVal, max=sumMax||1, s100=Math.round(raw/max*100);
  var band=(META.matriz||[]).find(function(b){return s100>=b.min&&s100<=b.max})||{riesgo:"—",favorable:false,texto:""};
  return {X:X,Y:Y,raw:raw,max:max,s100:s100,band:band,got:got,tot:tot,recs:recs,intermedia:intermedia};
}

function nuevaInspeccion(estId){
  FORM={id:"i"+Date.now(),codigo:"RT-2026-"+String(DB.inspecciones.length+1).padStart(4,"0"),
    establecimientoId:estId||null,modo:"completa",_step:0,estado:"borrador",inspector:SES?SES.name:"",
    fecha:NOW.toISOString(),ocupacion:"",clasifRiesgo:"",ans:{},fuentes:{},fotos:{},obs:{}};
  VIEW="inspeccion";render();window.scrollTo(0,0);

function vInspeccion(v){
  if(!FORM){navTo("dashboard");return}
  FORM.modo="completa";
  if(FORM._step==null)FORM._step=0;
  var est=DB.establecimientos.find(function(x){return x.id===FORM.establecimientoId});
  var steps=[{k:"datos",t:"Datos"}];
  MOD.forEach(function(m){steps.push({k:m.id,t:"M"+m.id.replace("m",""),mod:m})});
  steps.push({k:"resumen",t:"Concepto"});
  if(FORM._step<0)FORM._step=0; if(FORM._step>steps.length-1)FORM._step=steps.length-1;
  var step=steps[FORM._step], prog=Math.round(FORM._step/(steps.length-1)*100);
  var head=el("div","card");head.style.marginBottom="14px";
  head.innerHTML='<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'+
    '<b class="num" style="font-size:13px;color:var(--muted)">Paso '+(FORM._step+1)+' de '+steps.length+'</b>'+
    '<span class="mono" style="font-size:12px;color:var(--muted)">'+esc(FORM.codigo)+'</span></div>'+
    '<div class="progwrap"><i style="width:'+prog+'%"></i></div>'+
    '<div class="stepnav">'+steps.map(function(s,i){return '<button class="stepchip '+(i===FORM._step?"on":"")+(i<FORM._step?" done":"")+'" data-i="'+i+'">'+esc(s.t)+'</button>'}).join("")+'</div></div>';
  v.appendChild(head);
  $$(".stepchip",head).forEach(function(b){b.addEventListener("click",function(){FORM._step=+b.dataset.i;render();window.scrollTo(0,0)})});
  var body=el("div");v.appendChild(body);
  if(step.k==="datos")renderDatos(body,est);
  else if(step.k==="resumen")renderResumen(body,est);
  else renderModuleStep(body,step.mod);
  var nav=el("div");nav.style.cssText="display:flex;gap:10px;margin-top:16px";
  nav.innerHTML=(FORM._step>0?'<button class="btn btn-g" id="pv">← Anterior</button>':'')+

    '<button class="btn btn-p btn-sm" id="impGo">Importar</button></div><p class="note" id="impMsg" style="margin-top:8px"></p>';

  v.appendChild(mt);

function importCsv(txt){
  var lines=(txt||"").split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  if(!lines.length){toast("Pega algunas filas primero");return}
  var n=0;
  lines.forEach(function(l){
    if(/^nombre\s*,/i.test(l))return;
    var p=l.split(",");if(p.length<4)return;
    var nombre=p[0].trim();if(!nombre)return;
    var barrio=(p[1]||"").trim(),fecha=(p[2]||"").trim(),vig=(p[3]||"").trim(),fav=/^(s|1|t|f)/i.test((p[4]||"si").trim());
    var e={id:"e"+Date.now()+"_"+n,codigo:"EST-"+String(DB.establecimientos.length+1).padStart(3,"0"),nombre:nombre,tipo:"Comercio",barrio:barrio||"—",dir:"—",ocup:"",act:"",nit:"",rep:"",tel:"",x:.2+Math.random()*.6,y:.2+Math.random()*.55,creado:NOW.toISOString()};
    DB.establecimientos.push(e);
    var cod="RT-IMP-"+String(DB.inspecciones.length+1).padStart(4,"0");
    var imp={id:"i"+Date.now()+"_"+n,codigo:cod,establecimientoId:e.id,modo:"completa",estado:"finalizada",inspector:"Importado",
      fecha:toIso(fecha),vigenciaHasta:toIso(vig),ocupacion:"",clasifRiesgo:"",ans:{},fuentes:{},fotos:{},obs:{},score100:fav?90:40,X:0,Y:0,
      concepto:{favorable:fav,riesgo:fav?"BAJO":"ALTO"},sig:sign(cod),importado:true};
    DB.inspecciones.push(imp);
    if(esOnline()){pushEst(e);enqueue("guardarInspeccion",{inspeccion:{idCliente:imp.id,codigo:imp.codigo,establecimientoId:e.id,fecha:imp.fecha,vigenciaHasta:imp.vigenciaHasta,score100:imp.score100,favorable:fav,riesgo:imp.concepto.riesgo,estado:"finalizada",respuestas:"{}",recomendaciones:"[]"}})}
    n++;
  });
  DB._ejemplo=false;persist();var msg=$("#impMsg");if(msg)msg.textContent=n+" inspecciones importadas.";toast(n+" importadas");setTimeout(function(){navTo("establecimientos")},700);
}

var pickRole=null;
$$("#userpick button").forEach(function(b){b.addEventListener("click",function(){pickRole=b.dataset.role;$$("#userpick button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel")})});
$$("#pin input").forEach(function(inp,i,arr){inp.addEventListener("input",function(){this.value=this.value.replace(/\D/g,"");if(this.value&&arr[i+1])arr[i+1].focus()});inp.addEventListener("keydown",function(e){if(e.key==="Backspace"&&!this.value&&arr[i-1])arr[i-1].focus()})});
function afterLogin(){try{sessionStorage.setItem(SESK,JSON.stringify(SES))}catch(e){}$("#login").hidden=true;$("#app").hidden=false;VIEW="dashboard";render();updateSync()}
function demoLogin(){var role=pickRole||"inspector";SES={role:role,name:role==="comandante"?"Jeferson Rangel":"Inspector CBVI"};if(!DB.establecimientos.length){DB=seed();persist()}afterLogin()}
$("#btnLogin").addEventListener("click",function(){
  var pin=$$("#pin input").map(function(x){return x.value}).join("");
  if(pin.length<4){toast("Escribe el PIN de 4 dígitos");return}
  var email=($("#loginEmail").value||"").trim().toLowerCase();
  if(email){
    var btn=$("#btnLogin");btn.disabled=true;toast("Conectando…");
    api("login",{email:email,pin:pin}).then(function(res){btn.disabled=false;
      if(res&&res.ok){SES={role:res.usuario.rol,name:res.usuario.nombre||email,email:email,pase:res.pase};afterLogin();pullAll().then(flush)}
      else toast((res&&res.error)||"No se pudo entrar");
    }).catch(function(){btn.disabled=false;toast("Sin conexión al servidor: modo demo");demoLogin()});
    return;
  }
  if(!pickRole){toast("Escribe tu correo y PIN, o elige un rol para el demo");return}
  demoLogin();
});
$("#solicitar").addEventListener("click",function(ev){ev.preventDefault();
  modal("Solicitar acceso",
    '<div class="ff"><div class="wide"><label class="lbl">Correo</label><input id="sEmail" type="email" placeholder="tu correo"></div><div class="wide"><label class="lbl">Tu nombre</label><input id="sNom" type="text"></div></div><p class="note">El administrador debe aprobarte y darte un PIN antes de que puedas entrar.</p>',
    "Enviar solicitud",
    function(){ var em=($("#sEmail").value||"").trim().toLowerCase(); if(!em){toast("Escribe tu correo");return false}
      api("solicitarAcceso",{email:em,nombre:($("#sNom").value||"").trim()}).then(function(res){ toast(res&&res.ok?"Solicitud enviada. Espera la aprobación del administrador.":((res&&res.error)||"No se pudo enviar")); }).catch(function(){toast("Sin conexión al servidor")});
      return true;
    });
});
function logout(){SES=null;try{sessionStorage.removeItem(SESK)}catch(e){}$("#app").hidden=true;$("#login").hidden=false;$$("#pin input").forEach(function(x){x.value=""});pickRole=null;$$("#userpick button").forEach(function(x){x.classList.remove("sel")});updateSync()}

initTheme();
try{var s=JSON.parse(sessionStorage.getItem(SESK));if(s&&s.role){SES=s;$("#login").hidden=true;$("#app").hidden=false;VIEW="dashboard";render();updateSync();if(esOnline()){pullAll().then(flush)}}}catch(e){}
window.addEventListener("online",function(){updateSync();flush()});
window.addEventListener("offline",function(){updateSync()});
})();
</script>
